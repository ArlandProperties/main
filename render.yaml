services:
  - type: web
    name: arcland-properties
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: arcland-postgres
          property: connectionString
databases:
  - name: arcland-postgres
    plan: free
    region: virginia
    databaseName: arcland
    user: arcland
    ipAllowList: []
