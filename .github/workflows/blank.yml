name: Application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcland
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: arcland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.storage == 'postgres' && 'postgresql://arcland:test-only-password@localhost:5432/arcland_test' || '' }}
      - run: npm run build
      - if: matrix.storage == 'sqlite'
        run: npx playwright install --with-deps chromium
      - if: matrix.storage == 'sqlite'
        run: npm run test:browser
