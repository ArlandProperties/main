lumns:minmax(0,1.65fr) minmax(280px,1fr);gap:24px;margin-bottom:25px}.panel{border:1px solid var(--line);border-radius:11px;background:white;overflow:hidden}.panelhead{padding:20px 22px;display:flex;justify-content:space-between;align-items:center}.panelhead h2{font:700 14px Manrope;margin:0}.panelhead p{font-size:11px;color:var(--muted);margin:5px 0 0}.panelhead button{font-size:11px;padding:7px 10px}.chartlegend{display:flex;gap:20px;font-size:10px;color:#848b83;padding:0 22px}.dot{display:inline-block;width:7px;height:7px;background:#335947;border-radius:50%;margin-right:6px}.dot.light{background:#c8d3b7}.chart{height:215px;padding:18px 22px 10px;display:flex;gap:14px}.yaxis{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:#92988e;padding-bottom:25px}.bars{display:flex;justify-content:space-around;align-items:flex-end;flex:1;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 43px,#f1f2ed 44px)}.month{height:100%;display:flex;align-items:flex-end;gap:5px;position:relative;padding-bottom:25px;flex:1;justify-content:center}.bar{width:16px;border-radius:4px 4px 0 0;background:#315844;transition:height .3s}.bar.light{background:#cbd5b8}.month label{position:absolute;bottom:3px;font-size:9px;color:#92988e}.chartfoot{border-top:1px solid var(--line);padding:13px 22px;display:flex;justify-content:space-between;font-size:10px;color:#8b9389}.chartfoot b{color:#49643d;font-weight:500}.tasks{padding:0 22px}.task{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eff0eb;padding:15px 0}.task:last-child{border-bottom:0}.taskicon{width:33px;height:33px;border-radius:7px;background:#f7eee4;color:#ac885e;display:grid;place-items:center}.task h3{font-size:12px;margin:0 0 5px;font-weight:500}.task p{font-size:10px;color:#91978f;margin:0}.task .tag{margin-left:auto}.tag{font-size:9px;padding:5px 8px;border-radius:4px;background:#eef3e9;color:#617a50;white-space:nowrap}.tag.orange const icons=['▦','▤','♙','▧','⚒','◷'];const pages=['Overview','Properties','Tenants','Financials','Maintenance','Activity'];let page='Overview';let query='';let period='6 months';const money=n=>'$'+Number(n).toLocaleString('en-US');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const images=['photo-1600607687920-4e2a09cf159d','photo-1600596542815-ffad4c1539a9','photo-1600585154340-be6161a56a0c'];const initial={properties:[{name:'The Willow Residences',address:'124 Willow Avenue, Toronto, ON',units:48,occupied:46,rent:86400,type:'Residential',image:0},{name:'Parkside Apartments',address:'82 Parkside Drive, Mississauga, ON',units:36,occupied:35,rent:68250,type:'Residential',image:1},{name:'Oakwood Business Centre',address:'310 Oakwood Road, Toronto, ON',units:24,occupied:23,rent:62400,type:'Commercial',image:2}],tenants:[{name:'Olivia Bennett',property:'The Willow Residences',unit:'204',rent:1850,status:'Paid'},{name:'James Wilson',property:'Parkside Apartments',unit:'312',rent:1950,status:'Paid'},{name:'Sophia Chen',property:'The Willow Residences',unit:'108',rent:1800,status:'Pending'},{name:'Northline Studio',property:'Oakwood Business Centre',unit:'Suite 6',rent:2600,status:'Paid'}],tasks:[{title:'Water leak in kitchen',property:'The Willow Residences',unit:'Unit 204',priority:'Urgent',status:'Open'},{title:'HVAC seasonal inspection',property:'Oakwood Business Centre',unit:'Building-wide',priority:'Scheduled',status:'Open'},{title:'Replace hallway lighting',property:'Parkside Apartments',unit:'Floor 3',priority:'In progress',status:'Open'}],activity:[]};let data;try{data=JSON.parse(localStorage.getItem('arcland-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}function save(action){if(action)data.activity.unshift({title:action,time:new Date().toLocaleString()});localStorage.setItem('arcland-v1',JSON.stringify(data))}function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}function go(p){page=p;query='';document.querySelector('#search').value='';render()}function openTasks(){return data.tasks.filter(t=>t.status!=='Completed')}function total(k){return data.properties.reduce((s,p)=>s+Number(p[k]),0)}function render(){document.querySelector('#nav').innerHTML=pages.map((p,i)=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')"><span class="ico">${icons[i]}</span><span class="label">${p}</span>${p==='Maintenance'?`<span class="count">${openTasks().length}</span>`:''}</button>`).join('');document.querySelector('#crumb').textContent=page;document.querySelector('#content').innerHTML=`<div class="titleline"><div><h1>${page==='Overview'?'Portfolio overview':page}</h1><p class="sub">${({Overview:'A clearer view of your properties. A better way to manage.',Properties:'Every property, one connected portfolio.',Tenants:'Build better relationships with the people who call it home.',Financials:'Keep your portfolio’s financial health in focus.',Maintenance:'Keep every property running at its best.',Activity:'The latest updates across your workspace.'})[page]}</p></div><div class="actions"><button onclick="exportData()">↓ &nbsp; Export report</button><button class="primary" onclick="openForm('${page==='Tenants'?'tenant':page==='Maintenance'?'task':'property'}')">＋ &nbsp; ${page==='Tenants'?'Add tenant':page==='Maintenance'?'New request':'Add property'}</button></div></div>${page==='Overview'?overview():page==='Properties'?propertyPanel(true):page==='Tenants'?tenantPanel():page==='Financials'?financials():page==='Maintenance'?maintenance():activity()}<div class="bottomnote"><span>© ${new Date().getFullYear()} Arcland Properties Inc. &nbsp; · &nbsp; Sample portfolio · Saved on this browser</span><span>Thoughtfully managed. Confidently growing.</span></div>`}function metrics(){return `<div class="metrics">${[['Total properties',data.properties.length,'Across your portfolio','▤'],['Occupancy rate',(100*total('occupied')/Math.max(total('units'),1)).toFixed(1)+'%','of '+total('units')+' total units','◉'],['Monthly rental income',money(total('rent')),'Scheduled monthly revenue','＄'],['Open maintenance',openTasks().length,openTasks().filter(t=>t.priority==='Urgent').length+' require urgent attention','⚒']].map((x,i)=>`<div class="metric"><div class="metrichead"><span>${x[0]}</span><span>${x[3]}</span></div><strong>${x[1]}</strong><div class="trend"><b>${i===1?'● Healthy':i===3?'● Active':'↗ Portfolio'}</b> ${x[2]}</div></div>`).join('')}</div>`}function overview(){return `<div class="welcome"><div><div class="eyebrow">YOUR PORTFOLIO, AT A GLANCE</div><h2>Good things are taking shape.</h2><p>Stay connected to your properties, your people, and what’s next.</p></div><div class="right"><div><strong>${total('units')}</strong><small>SPACES MANAGED</small></div><button onclick="go('Properties')">Explore portfolio &nbsp; ↗</button></div></div>${metrics()}<div class="grid">${chart()}<section class="panel"><div class="panelhead"><div><h2>Needs your attention</h2><p>A few things to keep moving</p></div><span class="tag orange">${openTasks().length} open</span></div><div class="tasks">${openTasks().slice(0,3).map((t,i)=>`<div class="task"><div class="taskicon">${['♧','◷','☼'][i%3]}</div><div><h3>${esc(t.title)}</h3><p>${esc(t.property.split(' ').slice(0,2).join(' '))} · ${esc(t.unit)}</p></div><span class="tag ${t.priority==='Urgent'?'red':t.priority==='Scheduled'?'':'orange'}">${esc(t.priority)}</span></div>`).join('')||'<div class="empty">You’re all caught up.</div>'}</div><div class="taskfoot"><button class="textbtn" onclick="go('Maintenance')">View all maintenance &nbsp; →</button></div></section></div>${propertyPanel(false)}`}function chart(){const months=period==='6 months'?['Jun','Jul','Aug','Sep','Oct','Nov']:['Jan','Feb','Mar','Apr','May','Jun'];return `<section class="panel"><div class="panelhead"><div><h2>Income & expenses</h2><p>Your portfolio’s financial performance · Sample history</p></div><button onclick="period=period==='6 months'?'Previous period':'6 months';render()">${period} ⌄</button></div><div class="chartlegend"><span><i class="dot"></i>Rental income</span><span><i class="dot light"></i>Expenses</span></div><div class="chart"><div class="yaxis"><span>$250k</span><span>$200k</span><span>$150k</span><span>$100k</span><span>$50k</span></div><div class="bars">${months.map((m,i)=>`<div class="month"><div class="bar" style="height:${[66,76,71,83,79,90][i]-(period==='6 months'?0:10)}%" title="${m} income"></div><div class="bar light" style="height:${[33,39,32,42,37,39][i]}%" title="${m} expenses"></div><label>${m}</label></div>`).join('')}</div></div><div class="chartfoot"><span>Healthy growth, month over month</span><b>↗ Income trending up</b></div></section>`}function propertyPanel(full){const props=data.properties.filter(p=>(p.name+' '+p.address+' '+p.type).toLowerCase().includes(query.toLowerCase()));return `<section class="panel"><div class="panelhead"><div><h2>${full?'Property portfolio':'Your properties'} <span style="color:#9ca493;font-weight:400;margin-left:6px">${data.properties.length}</span></h2><p>A place for every possibility</p></div>${!full?'<button class="textbtn" onclick="go(\'Properties\')">View all properties &nbsp; →</button>':'<select aria-label="Filter property type" onchange="query=this.value;render()"><option value="">All properties</option><option>Residential</option><option>Commercial</option></select>'}</div><div class="propertygrid">${props.filter(p=>!['Residential','Commercial'].includes(query)||p.type===query).map(p=>`<article class="property" tabindex="0" role="button" onclick="propertyDetail(${data.properties.indexOf(p)})" onkeydown="if(event.key==='Enter')propertyDetail(${data.properties.indexOf(p)})"><div class="propertyimage" style="background-image:url('https://images.unsplash.com/${images[p.image%3]}?auto=format&fit=crop&w=700&q=85')"><span class="tag">${esc(p.type)}</span></div><div class="propertybody"><h3>${esc(p.name)}</h3><p>⌖ ${esc(p.address)}</p><div class="propertydetails"><span><b>${p.units}</b> units</span><span><b>${Math.round(100*p.occupied/Math.max(p.units,1))}%</b> occupied</span><span><b>${money(p.rent)}</b><small>/mo</small></span></div><div class="progress"><span style="width:${100*p.occupied/Math.max(p.units,1)}%"></span></div></div></article>`).join('')||'<p class="empty">No properties match your search.</p>'}</div></section>`}function tenantPanel(){return `<section class="panel"><div class="panelhead"><h2>Tenant directory</h2><span class="tag">${data.tenants.length} tenants</span></div><table><thead><tr><th>TENANT</th><th>PROPERTY</th><th>UNIT</th><th>MONTHLY RENT</th><th>PAYMENT</th></tr></thead><tbody>${data.tenants.filter(t=>(t.name+' '+t.property).toLowerCase().includes(query.toLowerCase())).map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.property)}</td><td>${esc(t.unit)}</td><td>${money(t.rent)}</td><td><button class="tag ${t.status==='Pending'?'orange':''}" onclick="togglePayment(${data.tenants.indexOf(t)})">${t.status} ${t.status==='Pending'?'· Mark paid':'✓'}</button></td></tr>`).join('')}</tbody></table></section>`}function financials(){return `${metrics()}<div class="grid">${chart()}<section class="panel"><div class="panelhead"><h2>Rent collection</h2></div><div style="padding:0 22px 28px"><p class="sub">Sample tenant ledger</p><h1 style="margin:20px 0">${money(data.tenants.filter(t=>t.status==='Paid').reduce((s,t)=>s+Number(t.rent),0))}</h1><p class="sub">collected from ${data.tenants.filter(t=>t.status==='Paid').length} tenants</p><div class="progress" style="margin:25px 0"><span style="width:${100*data.tenants.filter(t=>t.status==='Paid').length/Math.max(data.tenants.length,1)}%"></span></div><button onclick="go('Tenants')">Manage payments →</button></div></section></div>${tenantPanel()}`}function maintenance(){return `<section class="panel"><div class="panelhead"><h2>Maintenance requests</h2><span class="tag orange">${openTasks().length} open</span></div><table><thead><tr><th>REQUEST</th><th>PROPERTY / UNIT</th><th>PRIORITY</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>${data.tasks.filter(t=>(t.title+' '+t.property).toLowerCase().includes(query.toLowerCase())).map(t=>`<tr><td><b>${esc(t.title)}</b></td><td>${esc(t.property)}<br><small style="color:#8c9587">${esc(t.unit)}</small></td><td><span class="tag ${t.priority==='Urgent'?'red':'orange'}">${esc(t.priority)}</span></td><td>${t.status}</td><td>${t.status==='Completed'?'<span class="tag">Completed ✓</span>':`<button onclick="completeTask(${data.tasks.indexOf(t)})">Mark complete</button>`}</td></tr>`).join('')}</tbody></table></section>`}function activity(){return `<section class="panel"><div class="panelhead"><h2>Workspace activity</h2></div>${data.activity.length?data.activity.map(a=>`<div class="task" style="padding:20px 22px"><div class="avatar">✓</div><div><h3>${esc(a.title)}</h3><p>${esc(a.time)}</p></div></div>`).join(''):'<div class="empty">Your updates will appear here as you manage your portfolio.</div>'}</section>`}const modal=document.querySelector('#modal');function show(html){modal.innerHTML=html;modal.showModal()}function propertyDetail(i){let p=data.properties[i];show(`<h2>${esc(p.name)}</h2><p class="sub">${esc(p.address)}</p><div style="margin:25px 0;line-height:2.4">${esc(p.type)} property<br><b>${p.occupied} of ${p.units}</b> units occupied<br><b>${money(p.rent)}</b> monthly rental income</div><div class="actions"><button onclick="modal.close()">Close</button><button class="primary" onclick="modal.close();openForm('property',${i})">Edit property</button></div>`)}function openForm(kind,index=-1){let p=index>=0?data.properties[index]:{};const options=data.properties.map(p=>`<option>${esc(p.name)}</option>`).join('');show(`<h2>${index>=0?'Edit':kind==='task'?'New':'Add'} ${kind==='task'?'maintenance request':kind}</h2><form id="entry">${kind==='property'?`<label>Property name<input name="name" required value="${esc(p.name||'')}" placeholder="e.g. Maple Court"></label><label>Address<input name="address" required value="${esc(p.address||'')}"></label><label>Property type<select name="type"><option ${p.type==='Residential'?'selected':''}>Residential</option><option ${p.type==='Commercial'?'selected':''}>Commercial</option></select></label><div style="display:flex;gap:12px"><label>Total units<input name="units" type="number" min="1" max="100000" required value="${p.units||1}"></label><label>Occupied units<input name="occupied" type="number" min="0" required value="${p.occupied||0}"></label></div><label>Monthly rental income ($)<input name="rent" type="number" min="0" step="0.01" required value="${p.rent||0}"></label>`:kind==='tenant'?`<label>Tenant name<input name="name" required></label><label>Property<select name="property">${options}</select></label><label>Unit<input name="unit" required></label><label>Monthly rent ($)<input name="rent" required type="number" min="0" step="0.01"></label>`:`<label>Request title<input name="title" required></label><label>Property<select name="property">${options}</select></label><label>Unit / location<input name="unit" required></label><label>Priority<select name="priority"><option>Scheduled</option><option>In progress</option><option>Urgent</option></select></label>`}<div class="actions"><button type="button" onclick="modal.close()">Cancel</button><button class="primary" type="submit">${index>=0?'Save changes':'Create '+(kind==='task'?'request':kind)}</button></div></form>`);document.querySelector('#entry').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(kind==='property'){v.units=+v.units;v.occupied=+v.occupied;v.rent=+v.rent;if(v.occupied>v.units){e.target.occupied.setCustomValidity('Occupied units cannot exceed total units.');e.target.occupied.reportValidity();e.target.occupied.oninput=()=>e.target.occupied.setCustomValidity('');return}v.image=index>=0?p.image:data.properties.length%3;if(index>=0)data.properties[index]=v;else data.properties.push(v)}else if(kind==='tenant'){v.rent=+v.rent;v.status='Pending';data.tenants.push(v)}else{v.status='Open';data.tasks.push(v)}save(`${index>=0?'Updated':'Added'} ${kind}: ${v.name||v.title}`);modal.close();render();toast('Saved successfully')};}function togglePayment(i){if(data.tenants[i].status==='Paid'){toast('This payment is already recorded.');return}data.tenants[i].status='Paid';save('Recorded rent payment for '+data.tenants[i].name);render();toast('Payment recorded')}function completeTask(i){data.tasks[i].status='Completed';save('Completed request: '+data.tasks[i].title);render();toast('Request marked complete')}function exportData(){let rows=[['Property','Address','Type','Units','Occupied','Monthly rent'],...data.properties.map(p=>[p.name,p.address,p.type,p.units,p.occupied,p.rent])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Arcland-portfolio-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Portfolio report exported')}function help(){show('<h2>Your workspace, made simple.</h2><p style="line-height:1.8;color:#72806b">Add and edit buildings in Properties. Manage tenant records and record rent payments in Tenants. Track requests and mark work complete in Maintenance. Export your portfolio as a CSV report anytime.</p><p style="font-size:12px;line-height:1.7;color:#8a9483">This app starts with sample data. Changes are saved in this browser and are not shared across devices.</p><div class="actions"><button class="primary" onclick="modal.close()">Got it</button></div>')}function notifications(){show(`<h2>Notifications</h2><p class="sub">${openTasks().length} maintenance requests are awaiting attention.</p><div class="actions"><button onclick="modal.close()">Close</button><button class="primary" onclick="modal.close();go('Maintenance')">View requests</button></div>`)}document.querySelector('#search').oninput=e=>{query=e.target.value;if(page==='Overview'){page='Properties'}render()};modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});render();
</script></body></html>
